<div class="admin-layout flex h-screen min-h-screen w-full min-w-0 flex-col overflow-hidden">
  <admin-topbar
    class="relative z-50 block shrink-0"
    [title]="title()"
    [username]="username()"
    (menuClicked)="onMenuClick()"
    (userClicked)="onUserClick()">
  </admin-topbar>

  <div class="admin-layout__body relative flex min-h-0 w-full flex-1 overflow-hidden">
    @if (drawerOpened()) {
      <button
        type="button"
        class="fixed inset-x-0 bottom-0 top-[62px] z-30 bg-slate-950/35 lg:hidden"
        aria-label="Close navigation"
        (click)="onMenuClick()">
      </button>

      <admin-sidebar
        [activeMenu]="activeMenu()"
        [drawerOpened]="drawerOpened()"
        (dashboardClicked)="onDashboardClick()"
        (channelManagementClicked)="onChannelManagementClick()"
        (productManagementClicked)="onProductManagementClick()"
        (workflowManagementClicked)="onWorkflowManagementClick()"
        (parametersClicked)="onParametersClick()"
        (apiManagementClicked)="onApiManagementClick()"
        (authorizedClicked)="onAuthorizedClick()"
        (unauthorizedClicked)="onUnauthorizedClick()"
        (incompleteClicked)="onIncompleteClick()"
        (declinedClicked)="onDeclinedClick()"
        (ecVerificationClicked)="onEcVerificationClick()"
        (userActivityLogClicked)="onUserActivityLogClick()"
        (kycReportByYearClicked)="onKycReportByYearClick()">
      </admin-sidebar>
    }

    <main class="admin-layout__content h-full min-h-0 w-full min-w-0 flex-1 overflow-x-hidden overflow-y-auto overscroll-contain p-2 sm:p-3 md:p-4 lg:p-5 xl:p-6">
      <ng-content></ng-content>
    </main>
  </div>
</div>
