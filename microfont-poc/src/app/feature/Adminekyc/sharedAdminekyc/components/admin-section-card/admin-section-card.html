<section class="admin-section-card w-full min-w-0 p-3 sm:p-4 md:p-5 lg:p-6">
  @if (title() || subtitle()) {
    <div class="admin-section-card__header">
      @if (title()) {
        <h3>{{ title() }}</h3>
      }

      @if (subtitle()) {
        <p>{{ subtitle() }}</p>
      }
    </div>
  }

  <div class="admin-section-card__content">
    <ng-content></ng-content>
  </div>
</section>
